name: Build Minima with SPHINCS+

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle (fat JAR)
        run: ./gradlew clean shadowJar

      - name: Verify JAR exists
        run: |
          echo "=== Built JARs ==="
          ls -lh build/libs/
          JAR_FILE=$(ls build/libs/*-all.jar 2>/dev/null | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: fat JAR not found!"
            exit 1
          fi
          echo "Fat JAR: $JAR_FILE"
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV
          echo "JAR_NAME=$(basename $JAR_FILE)" >> $GITHUB_ENV

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: minima-sphincs
          path: build/libs/*-all.jar
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Minima SPHINCS+ v1.0.${{ github.run_number }}"
          body: |
            ## Minima with SPHINCS+ post-quantum signatures

            Automated build from commit `${{ github.sha }}`

            **SPHINCS+ (NIST FIPS 205)** — SHAKE-128s, 128-bit post-quantum security, ~7KB signatures.
            Based on `minima-global/Minima` branch `dev-spartacus`.

            ### How to run
            ```bash
            java -jar ${{ env.JAR_NAME }}
            ```

            ### Changes in this build
            ${{ github.event.head_commit.message }}
          files: build/libs/*-all.jar
          make_latest: true
