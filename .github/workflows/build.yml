name: Build Minima with SPHINCS+

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle (fat JAR)
        run: ./gradlew clean shadowJar

      - name: Run tests
        run: ./gradlew test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: minima-sphincs
          path: build/libs/*-all.jar
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }} — Minima with SPHINCS+"
          body: |
            Automated build from commit ${{ github.sha }}

            **Minima node with SPHINCS+ post-quantum signatures (NIST FIPS 205)**

            Changes: SHAKE-128s parameters, 128-bit post-quantum security, ~7KB signatures.
            Based on `minima-global/Minima` branch `dev-spartacus`.

            ### Download
            `minima-all.jar` — fat JAR with all dependencies, ready to run:
            ```
            java -jar minima-all.jar
            ```
          files: build/libs/*-all.jar
          make_latest: true
